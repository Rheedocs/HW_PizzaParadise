<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="da">
<head>
    <meta charset="UTF-8">
    <title>Pizza Paradise - Ordrehistorik</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header>
    <h1><span>🍕</span> <a th:href="@{/}">Pizza Paradise</a></h1>
    <nav>
        <a th:href="@{/}">Forside</a>
        <a th:href="@{/pizzas}">Se menu</a>
    </nav>
</header>
<main>
    <h1>Ordrehistorik</h1>
    <table>
        <thead>
        <tr>
            <th>Ordre ID</th>
            <th>Dato</th>
            <th>Total</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="order : ${orders}">
            <td th:text="${order.id}"></td>
            <td th:text="${order.date}"></td>
            <td th:text="${order.calculateTotal()}"></td>
            <td><a th:href="@{/orders/{id}(id=${order.id})}">Se detaljer</a></td>
        </tr>
        </tbody>
    </table>
    <a class="btn" th:href="@{/}">Tilbage til forsiden</a>
</main>
</body>
</html>
